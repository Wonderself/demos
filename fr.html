<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demos — WonderSelf</title>
  <meta name="theme-color" content="#0b0b0c">
  <style>
    :root{--bg:#0b0b0c;--bg2:#121214;--line:rgba(232,224,212,.12);--ink:#e8e0d4;--muted:rgba(232,224,212,.62);--faint:rgba(232,224,212,.38);--gold:#c4a574;--goldim:rgba(196,165,116,.16);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;--sans:"Helvetica Neue",Helvetica,"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--ink)}
    body{font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    .wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;gap:16px}
    .mark{font-family:var(--serif);font-size:18px}
    .mark span{color:var(--faint);font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-inline-start:12px}
    .nav-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .nav-link{font-size:12px;color:var(--muted)}
    .nav-link:hover{color:var(--gold)}
    .lang{display:flex;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    .lang button{color:var(--faint)}
    .lang button[aria-pressed=true]{color:var(--ink)}
    .hero{padding:88px 0 64px;max-width:740px}
    .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
    html[dir=rtl] .kicker{letter-spacing:.06em}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.08}
    .lead{margin-top:22px;max-width:52ch;color:var(--muted);font-size:17px;line-height:1.55}
    section{padding:12px 0 72px}
    .sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .sec-title h2{font-family:var(--serif);font-size:22px;font-weight:400}
    .sec-title p{color:var(--faint);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .grid-main,.grid-side{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{display:flex;flex-direction:column;min-height:280px;padding:26px 24px 22px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;transition:border-color .2s,transform .2s,background .2s}
    a.card:hover{border-color:rgba(196,165,116,.45);transform:translateY(-2px);background:#161618}
    .top{margin-bottom:28px}
    .badge{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);background:var(--goldim);border:1px solid rgba(196,165,116,.28);border-radius:999px;padding:4px 9px}
    .name{font-family:var(--serif);font-size:32px;line-height:1.05}
    .blurb{margin-top:12px;color:var(--muted);font-size:15px;line-height:1.5;flex:1}
    .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
    .go{color:var(--gold);white-space:nowrap}
    .card.compact{min-height:220px}
    .card.compact .name{font-size:26px}
    footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 48px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
    @media(max-width:860px){.grid-main,.grid-side{grid-template-columns:1fr}.hero{padding:56px 0 40px}.card{min-height:auto}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="index.html">WonderSelf<span>Demos</span></a>
      <div class="nav-right">
        <a class="nav-link" href="method.html?l=fr" data-i18n-href="method"></a>
        <div class="lang" role="group">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="he">עב</button>
        </div>
      </div>
    </header>
    <div class="hero">
      <p class="kicker" data-i="kicker"></p>
      <h1 data-i="title"></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <section>
      <div class="sec-title"><h2 data-i="coreTitle"></h2><p data-i="coreSub"></p></div>
      <div class="grid-main" id="core"></div>
    </section>
    <section>
      <div class="sec-title"><h2 data-i="sideTitle"></h2><p data-i="sideSub"></p></div>
      <div class="grid-side" id="side"></div>
    </section>
    <footer><div data-i="footerL"></div><div>WonderSelf · Tel Aviv × Paris</div></footer>
  </div>
  <script src="app.js"></script>
  <script>window.DEMOS_PAGE="home";window.DEMOS_BOOT()</script>
</body>
</html>
